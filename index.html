 m", "10 m", "20 m"], 0], ["Penalaran dan Pemeriksaan Hasil", "Pemecahan masalah dimulai dari membaca situasi, menggambar sketsa, menentukan titik dan sisi bersesuaian, menyusun rasio, menghitung, lalu menafsirkan hasil. Jangan menganggap dua bangun sebangun hanya karena tampak mirip; periksa sudut atau perbandingan sisi. Dalam pengukuran sungai, gunakan titik pengamatan yang membentuk segitiga dengan sudut bersesuaian sama. Bandingkan jawaban dengan perkiraan lapangan untuk mendeteksi kesalahan.", "Perencanaan jalur pengamatan di tepi Danau Limboto harus mengutamakan keselamatan dan kelestarian ekosistem.", "Cinta tanah air diwujudkan melalui solusi matematika yang bermanfaat bagi masyarakat.", "Langkah pertama menyelesaikan soal kontekstual adalah…", ["Menebak hasil", "Memahami data dan menggambar sketsa", "Langsung mengalikan semua angka"], 1]], "games": [{"type": "mc", "q": "Dua persegi memiliki sisi 3 cm dan 9 cm. Hubungannya?", "opts": ["Sebangun tetapi tidak kongruen", "Kongruen", "Tidak sebangun"], "answer": 0, "stim": "Permasalahan ini mengajak kita membaca data dengan teliti..."}, {"type": "match", "q": "Pasangkan istilah dengan definisinya.", "opts": ["Sebangun|Bentuk sama, skala boleh berbeda", "Kongruen|Bentuk dan ukuran sama", "Skala|Rasio sisi bersesuaian"], "answer": null, "stim": "Permasalahan ini mengajak kita membaca data dengan teliti..."}, {"type": "order", "q": "Urutkan langkah menghitung sisi yang belum diketahui.", "opts": ["Identifikasi sisi bersesuaian", "Susun perbandingan", "Hitung nilai yang belum diketahui"], "answer": null, "stim": "Permasalahan ini mengajak kita membaca data dengan teliti..."}, {"type": "drag", "q": "Letakkan pasangan sisi yang tepat: 3 ↔ 6, 4 ↔ 8, 5 ↔ ...", "opts": ["10", "9", "12"], "answer": 0, "stim": "Permasalahan ini mengajak kita membaca data dengan teliti..."}, {"type": "multi", "q": "Pilih SEMUA pernyataan yang benar untuk dua persegi berbeda ukuran.", "opts": ["Sudut bersesuaian sama", "Rasio sisi bersesuaia secara adil...", "weight": 10}, {"q": "Jika 4 ↔ 10, maka 6 ↔ …", "opts": ["12", "15", "20"], "answer": 1, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 10}, {"q": "Tongkat 1 m bayangan 2 m; pohon bayangan 14 m. Tinggi pohon…", "opts": ["7 m", "14 m", "28 m"], "answer": 0, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 10}, {"q": "Segitiga 3,4,5 diperbesar 4 kali. Sisi terpanjang…", "opts": ["12", "16", "20"], "answer": 2, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 10}, {"q": "Dua persegi panjang 2×3 dan 4×7: apakah sebangun?", "opts": ["Ya", "Tidak", "Selalu kongruen"], "answer": 1, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 12}, {"q": "Bayangan pohon 9 m, tongkat 1,5 m bayangan 3 m. Tinggi pohon…", "opts": ["3 m", "4,5 m", "6 m"], "answer": 1, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 12}, {"q": "Model segitiga 5,12,13 dan rancangan 15,36,39. Keliling rancangan dibanding model…", "opts": ["3 kali", "6 kali", "9 kali"], "answer": 0, "stim": "Pengukuran harus dilakukan secara adil...", "weight": 12}]};
const verses=[{ref:'QS. Al-Qamar [54]: 49',arab:'إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ',translation:'Sesungguhnya Kami menciptakan segala sesuatu sesuai dengan ukuran.',note:'Keteraturan ukuran mengajak kita mempelajari perbandingan secara cermat.'},{ref:'QS. Ar-Rahman [55]: 9',arab:'وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ',translation:'Tegakkanlah timbangan itu dengan adil dan janganlah kamu mengurangi timbangan itu.',note:'Keadilan dalam mengukur dan mencatat data menjadi bagian dari akhlak belajar.'}];

// =========================================================================
// FUNGSI PENGIRIMAN DATA KE GOOGLE SHEETS
// =========================================================================
function sendDataSoalToGAS() {
    if(!GAS_URL || GAS_URL === "URL_GAS_ANDA_DISINI") return;
    let payloadSoal = [];
    DATA.games.forEach((g, i) => payloadSoal.push({kategori: 'Bermain', nomor: i+1, pertanyaan: g.q, opsi: JSON.stringify(g.opts), jawaban: JSON.stringify(g.answer)}));
    DATA.tests.forEach((t, i) => payloadSoal.push({kategori: 'Berlatih', nomor: i+1, pertanyaan: t.q, opsi: JSON.stringify(t.opts), jawaban: t.answer}));
    
    fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({action: 'saveSoal', dataSoal: payloadSoal})
    }).catch(e => console.log('Info: Gagal mengirim data soal', e));
}

function sendHasilToGAS() {
    if(!GAS_URL || GAS_URL === "URL_GAS_ANDA_DISINI") return;
    let skorAkhir = score();
    
    // Kalkulasi Benar/Salah dari Test Berlatih
    let benarBerlatih = DATA.tests.reduce((sum,q,i) => sum + (state.testAnswers[i] === q.answer ? 1 : 0), 0);
    
    // Total Benar dan Salah (Bermain + Berlatih)
    let totalBenar = state.gameAnswers.filter(Boolean).length + benarBerlatih;
    let totalSalah = (10 - state.gameAnswers.filter(Boolean).length) + (10 - benarBerlatih);

    let detailBermain = state.gameAnswers.map((res, i) => `[Soal ${i+1}: ${res ? 'Benar' : 'Salah'}]`).join(' ');
    
    let detailBerlatih = state.testAnswers.map((ans, i) => {
        let textAns = DATA.tests[i].opts[ans] || "Urutan/Jodoh";
        return `[Soal ${i+1}: Jawab Opsi ${ans} (${textAns}) - ${ans === DATA.tests[i].answer ? 'Benar' : 'Salah'}]`;
    }).join(' ');

    fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
            action: 'saveHasil',
            nama: state.name,
            kelas: state.kelas,
            skorAkhir: skorAkhir,
            benar: totalBenar,
            salah: totalSalah,
            detailBermain: detailBermain,
            detailBerlatih: detailBerlatih
        })
    }).catch(e => console.log('Info: Gagal mengirim hasil', e));
}

function saveIdentity(){
    let n=document.getElementById('studentName').value.trim(),k=document.getElementById('studentClass').value.trim();
    if(!n||!k){document.getElementById('formError').textContent='Nama lengkap dan kelas wajib diisi.';return}
    state.name=n;state.kelas=k;
    sendDataSoalToGAS(); // Trigger kirim soal sekali di awal
    goto('guide')
};

const guideTexts=[['Selamat Datang','Belajar dengan mengamati gambar, membaca konteks Gorontalo, dan menyelesaikan aktivitas pemantik.'],['Belajar → Bermain → Berlatih','Setiap tahap terbuka setelah tahap sebelumnya tuntas. Tuntaskan ketujuh slide materi dan seluruh tantangan permainan.'],['Cara Berinteraksi','Ketuk pilihan untuk menjawab. Untuk mengurutkan atau menjodohkan, gunakan ketukan atau drag dengan mouse. Perhatikan umpan balik dan catatan nilai.']];
function guide(){let x=guideTexts[state.guide];return `<section class="panel"><span class="pill">Panduan ${state.guide+1}/3</span><h2>Selamat Datang, ${esc(state.name)}!</h2><h3>${x[0]}</h3><p>${x[1]}</p><div class="row between"><button class="ghost" onclick="state.guide=Math.max(0,state.guide-1);render()" ${state.guide===0?'disabled':''}>← Kembali</button><button onclick="${state.guide===2?"goto('menu')":"state.guide++;render()"}">${state.guide===2?'Masuk ke Menu Utama':'Selanjutnya →'}</button></div></section>`};
function header(){return `<div class="row between no-print"><div><b>📐 Kesebangunan</b><div class="small muted">${esc(state.name)} • ${esc(state.kelas)}</div></div><button class="ghost" onclick="goto('menu')">⌂ Menu Utama</button></div>`};
function menu(){let learn=state.done.length===7,play=state.gameAnswers.length===10;return `${header()}<section class="panel"><h2>Jelajah Pembelajaran</h2><p>Ikuti jalur belajar yang terbuka secara bertahap.</p><div class="grid"><button class="tile" onclick="goto('learn')"><span class="pill">🔓 TERBUKA</span><h3>📚 BELAJAR</h3><p>7 slide materi • ${state.done.length}/7 selesai</p></button><button class="tile" onclick="${learn?"goto('game')":"locked('Tuntaskan 7 slide Belajar untuk membuka Bermain.')"}"><span class="pill">${learn?'🔓 TERBUKA':'🔒 TERKUNCI'}</span><h3>🎮 BERMAIN</h3><p>10 tantangan literasi dan numerasi</p></button><button class="tile" onclick="${play?"goto('test')":"locked('Selesaikan 10 tantangan Bermain untuk membuka Berlatih.')"}"><span class="pill">${play?'🔓 TERBUKA':'🔒 TERKUNCI'}</span><h3>📝 BERLATIH</h3><p>10 soal asesmen • total 100 poin</p></button></div></section>`};
function locked(t){modal(`<h2>🔒 Tahap Masih Terkunci</h2><p>${t}</p><p>Setiap langkah melatih ketekunan dan tanggung jawab.</p>`)};
function learn(){let i=state.slide,s=DATA.slides[i],done=state.done.includes(i);return `${header()}<section class="panel"><span class="pill">Materi ${i+1}/7</span><h2>${s[0]}</h2><div class="progress"><span style="width:${state.done.length/7*100}%"></span></div><h3>🔍 Konsep Inti</h3><p>${s[1]}</p><h3>🌿 Konteks Gorontalo</h3><p>${s[2]}</p><h3>💚 Kurikulum Berbasis Cinta</h3><p>${s[3]}</p>${verse(i)}<div class="challenge"><h3>⚡ Tantangan Pemantik</h3><p>${s[4]}</p>${s[5].map((o,j)=>`<button class="option" ${done?'disabled':''} onclick="answerSlide(${j})">${'ABC'[j]}. ${o}</button>`).join('')}<p id="learnFeedback" class="feedback" aria-live="polite">${done?'✓ Tantangan sudah diselesaikan.':''}</p></div><div class="row between"><button class="ghost" ${i===0?'disabled':''} onclick="state.slide--;render()">← Sebelumnya</button><button ${!done?'disabled':''} onclick="${i===6?"goto('menu')":"state.slide++;render()"}">${i===6?'Selesai & Buka Bermain':'Slide Selanjutnya →'}</button></div></section>`};
function answerSlide(j){let i=state.slide,s=DATA.slides[i];if(j===s[6]){if(!state.done.includes(i))state.done.push(i);document.getElementById('learnFeedback').textContent='✓ Tepat! Slide selesai. Silakan lanjut.';render()}else document.getElementById('learnFeedback').textContent='Belum tepat. Periksa kembali konsep dan coba lagi.'};
function moveHTML(items){return items.map((x,j)=>`<div class="moveitem ${state.picked.includes(j)?'active':''}" draggable="true" ondragstart="dragStart(event,${j})" ondragover="event.preventDefault()" ondrop="dropMove(event,${j})" onclick="tapMove(${j})">☰ ${esc(x)}</div>`).join('')};
let dragIndex=null;function dragStart(e,i){dragIndex=i;e.dataTransfer.setData('text/plain',String(i))};function dropMove(e,j){e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));swapMove(i,j)};function tapMove(j){if(dragIndex===null){dragIndex=j;state.picked=[j];renderInteraction()}else{swapMove(dragIndex,j);dragIndex=null}};
function swapMove(i,j){let a=state.order;[a[i],a[j]]=[a[j],a[i]];state.picked=[];renderInteraction()};
function currentGame(){return DATA.games[state.game]};
function renderInteraction(){let box=document.getElementById('interaction');if(box)box.innerHTML=gameControls(currentGame())};
function gameControls(g){if(g.type==='order'){if(!state.order.length)state.order=[...g.opts].reverse();return `<p class="small">Ketuk dua item untuk menukar posisi, atau seret dengan mouse. Susun dari atas ke bawah.</p>${moveHTML(state.order)}<button onclick="submitGame()">Periksa Urutan</button>`}if(g.type==='match'){let pairs=g.opts.map(x=>x.split('|'));return `<p>Ketuk istilah kiri, lalu ketuk definisi yang cocok di kanan.</p><div class="grid"><div>${pairs.map((p,i)=>`<button class="option ${state.matchLeft===i?'selected':''}" onclick="state.matchLeft=${i};renderInteraction()">${p[0]}</button>`).join('')}</div><div>${[2,0,1].map(i=>`<button class="option" onclick="chooseMatch(${i})">${pairs[i][1]}</button>`).join('')}</div></div><p>${state.match.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>')}</p><button onclick="submitGame()">Periksa Pasangan</button>`}return `${g.opts.map((x,j)=>`<button class="option ${state.picked.includes(j)?'selected':''}" onclick="pickGame(${j},'${g.type}')">${'ABC'[j]}. ${x}</button>`).join('')}<button onclick="submitGame()">Periksa Jawaban</button>`};
function chooseMatch(i){let g=currentGame();if(state.matchLeft===null)return;let p=g.opts.map(x=>x.split('|'));state.match=state.match.filter(x=>x[0]!==p[state.matchLeft][0]&&x[1]!==p[i][1]);state.match.push([p[state.matchLeft][0],p[i][1]]);state.matchLeft=null;renderInteraction()};
function pickGame(j,t){if(t==='multi')state.picked=state.picked.includes(j)?state.picked.filter(x=>x!==j):[...state.picked,j];else state.picked=[j];renderInteraction()};
function game(){if(state.game>=10)return gameSummary();let g=currentGame();return `${header()}<section class="panel"><span class="pill">Bermain • Tantangan ${state.game+1}/10 • ${g.type.toUpperCase()}</span><h2>Petualangan Kesebangunan</h2><div class="progress"><span style="width:${state.game*10}%"></span></div><h3>Stimulus Literasi</h3><p class="stim">${g.stim}</p><h3>${g.q}</h3><div id="interaction">${gameControls(g)}</div><p id="gameFeedback" class="feedback" aria-live="polite"></p></section>`};
function submitGame(){let g=currentGame(),ok=false;if(g.type==='order')ok=JSON.stringify(state.order)===JSON.stringify(g.opts);else if(g.type==='match'){let p=g.opts.map(x=>x.split('|'));ok=state.match.length===p.length&&p.every(x=>state.match.some(y=>y[0]===x[0]&&y[1]===x[1]))}else if(g.type==='multi')ok=JSON.stringify([...state.picked].sort())===JSON.stringify([...g.answer].sort());else ok=state.picked[0]===g.answer;if(g.type!=='order'&&g.type!=='match'&&!state.picked.length){document.getElementById('gameFeedback').textContent='Pilih jawaban terlebih dahulu.';return}state.gameAnswers.push(ok);state.game++;state.picked=[];state.order=[];state.match=[];state.matchLeft=null;dragIndex=null;render()};
function gameSummary(){let n=state.gameAnswers.filter(Boolean).length;return `${header()}<section class="panel center"><h2>🎉 Tantangan Bermain Selesai!</h2><h1>${n}/10</h1><p>Akurasi: ${n*10}% • Semua tantangan telah dikerjakan.</p><p>Berlatih sekarang terbuka. Teruslah belajar dengan jujur dan penuh semangat.</p><button onclick="goto('test')">Mulai Berlatih →</button></section>`};
function test(){if(state.test>=10)return report();let q=DATA.tests[state.test],level=state.test<3?1:state.test<7?2:3;return `${header()}<section class="panel"><span class="pill">Berlatih • Soal ${state.test+1}/10 • Level ${level} • ${q.weight} poin</span><h2>Asesmen Kesebangunan</h2><div class="progress"><span style="width:${state.test*10}%"></span></div><h3>Stimulus Bacaan</h3><p class="stim">${q.stim}</p><h3>${q.q}</h3>${q.opts.map((x,j)=>`<button class="option ${state.picked.includes(j)?'selected':''}" onclick="state.picked=[${j}];render()">${'ABC'[j]}. ${x}</button>`).join('')}<div class="row"><button onclick="submitTest()">${state.test===9?'Selesai & Lihat Laporan':'Simpan & Lanjut →'}</button></div><p id="testFeedback" class="error" aria-live="polite"></p></section>`};

function submitTest(){
    if(!state.picked.length){document.getElementById('testFeedback').textContent='Pilih satu jawaban terlebih dahulu.';return}
    state.testAnswers.push(state.picked[0]);
    state.test++;
    state.picked=[];
    if(state.test === 10) {
        sendHasilToGAS(); // Trigger kirim hasil ke GAS saat selesai soal terakhir
        goto('report');
    } else {
        goto('test');
    }
};

function score(){return DATA.tests.reduce((sum,q,i)=>sum+(state.testAnswers[i]===q.answer?q.weight:0),0)};function levelScore(a,b){let total=DATA.tests.slice(a,b).reduce((n,x)=>n+x.weight,0),earned=DATA.tests.slice(a,b).reduce((n,x,j)=>n+(state.testAnswers[a+j]===x.answer?x.weight:0),0);return `${earned}/${total} (${Math.round(100*earned/total)}%)`};
function report(){let s=score(),pred=s>=90?'Sangat Baik':s>=75?'Baik':s>=60?'Cukup':'Perlu Bimbingan',g=state.gameAnswers.filter(Boolean).length;return `<section id="reportScreen" class="panel report"><div class="center"><h2>LAPORAN HASIL BELAJAR</h2><b>MPI Kesebangunan • Matematika VII / Fase D</b><p>Imran Abdullah, S.Pd • MTs Swasta Hubulo</p><hr></div><table><tr><th>Nama siswa</th><td>${esc(state.name)}</td></tr><tr><th>Kelas</th><td>${esc(state.kelas)}</td></tr><tr><th>Tanggal</th><td>${new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</td></tr><tr><th>Bermain</th><td>${g}/10 benar • akurasi ${g*10}%</td></tr><tr><th>Nilai Berlatih</th><td><b>${s}/100</b> • ${pred}</td></tr><tr><th>Level 1 (Dasar)</th><td>${levelScore(0,3)}</td></tr><tr><th>Level 2 (Aplikasi)</th><td>${levelScore(3,7)}</td></tr><tr><th>Level 3 (HOTS)</th><td>${levelScore(7,10)}</td></tr></table><h3>Catatan Kurikulum Berbasis Cinta</h3><p>Terus tumbuhkan kejujuran dalam pengukuran, kepedulian terhadap sesama, rasa syukur kepada Allah, serta cinta lingkungan dan tanah air.</p><h3>Rekomendasi Guru</h3><p>${s>=75?'Pertahankan penguasaan konsep; coba proyek pengukuran bayangan secara berkelompok.':'Ulangi konsep sudut bersesuaian dan rasio sisi, lalu latihan dengan gambar dan pengukuran sederhana bersama guru.'}</p><div class="row no-print"><button onclick="downloadPDF()">Unduh / Cetak Laporan PDF</button><button class="ghost" onclick="goto('menu')">Kembali ke Menu</button></div></section>`};
function downloadPDF(){let e=document.getElementById('reportScreen');if(window.html2pdf){html2pdf().set({margin:10,filename:'Laporan-Kesebangunan-'+state.name.replace(/[^a-z0-9]/gi,'-')+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:2},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(e).save().catch(()=>window.print())}else window.print()};
function render(){app.innerHTML=({cover,identity,guide,menu,learn,game,test,report}[state.screen]||cover)()};render();setTimeout(()=>document.getElementById('splash').classList.add('hidden'),1700);
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script></body></html>
